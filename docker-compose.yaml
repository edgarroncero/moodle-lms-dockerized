services:
  db:
    image: mariadb:12.1.2-ubi
    hostname: db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./volumes/mariadb:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  php-fpm:
    build:
      context: ./php-fpm
    image: php-8.3-fpm-moodle:latest
    pull_policy: never
    hostname: php-fpm
    environment:
      - MOODLE_DB_TYPE=${MOODLE_DB_TYPE}
      - MOODLE_DB_HOST=${MOODLE_DB_HOST}
      - MOODLE_DB_NAME=${MYSQL_USER}
      - MOODLE_DB_USER=${MYSQL_USER}
      - MOODLE_DB_PASS=${MYSQL_PASSWORD}
      - MOODLE_URL=${MOODLE_URL}
      - MOODLE_DATAROOT=${MOODLE_DATAROOT}
      - MOODLE_DIRECTORYPERMISSIONS=${MOODLE_DIRECTORYPERMISSIONS}
      - MOODLE_SSLPROXY=${MOODLE_SSLPROXY}
    restart: unless-stopped
    volumes:
      - ./volumes/moodle:/var/www/html
      - ./volumes/moodledata:/var/local/moodledata
      - ./volumes/php-fpm/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - db

  nginx:
    #image: nginx:stable-alpine3.23
    image: nginx:1.28-trixie
    hostname: nginx
    restart: unless-stopped
    ports:
      - 127.0.0.1:${NGINX_PORT}:${NGINX_PORT}
    environment:
      - NGINX_PORT=${NGINX_PORT}
      - CLIENT_MAX_BODY_SIZE=${CLIENT_MAX_BODY_SIZE}
    volumes:
      - ./volumes/moodle:/var/www/html
      - ./volumes/nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template
    depends_on:
      - php-fpm
